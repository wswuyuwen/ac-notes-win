<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #faf8f2;
    color: #725d42;
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---- 编辑器（工具栏由宿主 WPF 提供，本页只有编辑区） ---- */
  /* ⚠️ #editor 必须固定高度（视口 100%）：.ProseMirror 的 height:100% 参照它，否则高度链断裂，
     内容撑开容器、body overflow:hidden 裁剪底部 → 长内容无滚动条（2026-08-04 DOM 取证实测） */
  #editor { height: 100%; }
  .ProseMirror {
    outline: none;
    padding: 8px 12px 30px;
    min-height: 100%;
    height: 100%;
    overflow-y: auto;
    user-select: text;
    caret-color: #725d42;
  }
  .ProseMirror::-webkit-scrollbar { width: 6px; }
  /* 滚动条 hover 展示手型指针（用户 2026-08-04 反馈：默认显示文本光标而非鼠标指针） */
  .ProseMirror::-webkit-scrollbar-thumb { background: rgba(114,93,66,0.28); border-radius: 3px; cursor: pointer; }
  .ProseMirror::-webkit-scrollbar-thumb:hover { background: rgba(114,93,66,0.42); cursor: pointer; }
  .ProseMirror::-webkit-scrollbar-track { background: rgba(114,93,66,0.04); cursor: pointer; }
  .ProseMirror h1 { font-size: 19px; font-weight: 600; color: #725d42; margin: 0.5em 0; }
  .ProseMirror h2 { font-size: 17px; font-weight: 600; color: #725d42; margin: 0.5em 0; }
  .ProseMirror h3 { font-size: 16px; font-weight: 600; color: #725d42; margin: 0.5em 0; }
  .ProseMirror p { margin: 0.35em 0; }
  .ProseMirror strong { font-weight: 700; }
  .ProseMirror em { font-style: italic; }
  .ProseMirror s { text-decoration: line-through; color: rgba(114,93,66,0.55); }
  .ProseMirror code {
    font-family: Consolas, monospace;
    font-size: 13px;
    background: rgba(25,200,185,0.14);
    color: #0f9a8e;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .ProseMirror pre {
    background: #f8f8f0;
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
  }
  .ProseMirror pre code { background: transparent; color: #725d42; padding: 0; }
  .ProseMirror a { color: #19c8b9; text-decoration: underline; cursor: pointer; }
  .ProseMirror blockquote {
    margin: 0.5em 0;
    padding-left: 12px;
    border-left: 3px solid rgba(114,93,66,0.20);
    color: rgba(114,93,66,0.62);
  }
  .ProseMirror ul, .ProseMirror ol { margin: 0.3em 0; padding-left: 22px; }
  .ProseMirror li { margin: 0.15em 0; }

  /* 任务列表：真实勾选框 */
  .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
  .ProseMirror ul[data-type="taskList"] li {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0.1em 0;   /* 项间基本间距 3px */
  }
  /* ⚠️ 真实空隙主源是任务文字 p 的 margin 0.35em×2（10.5px，占 78%），li.margin 只占 22%——
     用户 2026-08-04 反馈任务间空隙偏大，收紧任务项内段落 margin；正文 .ProseMirror p 不受影响 */
  .ProseMirror ul[data-type="taskList"] li p { margin: 0; }
  .ProseMirror ul[data-type="taskList"] li > label {
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"] {
    appearance: none;
    width: 15px;
    height: 15px;
    border: 1.5px solid rgba(114,93,66,0.45);
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"]:hover { border-color: rgba(114,93,66,0.7); }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"]:checked {
    background: #19c8b9;
    border-color: #19c8b9;
  }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4px; top: 1px;
    width: 4px; height: 8px;
    border: solid #faf8f2;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div {
    color: rgba(114,93,66,0.45);
    text-decoration: line-through;
  }
  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: rgba(114,93,66,0.30);
    float: left;
    height: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="editor"></div>

<script type="importmap">
{
  "imports": {
    "@tiptap/core": "./vendor/346bbe3293.js",
    "@tiptap/pm/state": "./vendor/9846cc506d.js",
    "@tiptap/pm/view": "./vendor/1b1c53bd88.js",
    "@tiptap/pm/model": "./vendor/2696d6c227.js",
    "@tiptap/pm/keymap": "./vendor/ee823aecb4.js",
    "@tiptap/pm/commands": "./vendor/67dc75f77d.js",
    "@tiptap/pm/schema-list": "./vendor/8fc7f5250e.js",
    "@tiptap/pm/transform": "./vendor/86468cd25f.js",
    "@tiptap/pm/inputrules": "./vendor/5729f1a27b.js",
    "@tiptap/pm/trailing-node": "./vendor/c3e8f2c333.js",
    "@tiptap/pm/gapcursor": "./vendor/34b0c64e32.js",
    "@tiptap/pm/dropcursor": "./vendor/b13bd9a068.js",
    "@tiptap/starter-kit": "./vendor/c5c35eedc8.js",
    "@tiptap/extension-task-list": "./vendor/4f82a43cbd.js",
    "@tiptap/extension-task-item": "./vendor/976fca8000.js",
    "@tiptap/extension-link": "./vendor/1bad945325.js",
    "@tiptap/extension-placeholder": "./vendor/684bace660.js"
  }
}
</script>
<script type="module">
import { Editor } from '@tiptap/core';
import StarterKit from '@tiptap/starter-kit';
import TaskList from '@tiptap/extension-task-list';
import TaskItem from '@tiptap/extension-task-item';
import Link from '@tiptap/extension-link';
import Placeholder from '@tiptap/extension-placeholder';

// 必须暴露到 window 供宿主（WPF WebView2）调用
// 存储格式：HTML（editor.getHTML/setContent），不依赖 @tiptap/markdown（esm.sh 上该包仅 v3 与 v2 核心不兼容）
window.__editor = new Editor({
  element: document.getElementById('editor'),
  extensions: [
    StarterKit,
    TaskList,
    TaskItem.configure({ nested: true }),
    Link.configure({ openOnClick: false }),
    Placeholder.configure({ placeholder: '今天想记点什么？' }),
  ],
  editorProps: {
    attributes: { spellcheck: 'false' },
  },
  onUpdate: () => window.chrome.webview.postMessage({
    type: 'content',
    html: window.__editor.getHTML(),
  }),
  onSelectionUpdate: () => {
    const s = window.__editor.state.selection;
    window.chrome.webview.postMessage({ type: 'selection', from: s.from, to: s.to });
  },
});

// 宿主互操作桥（内容为 HTML）
window.__notch = {
  getHTML: () => window.__editor.getHTML(),
  setContent: (html, from, to) => {
    window.__editor.commands.setContent(html, { emitUpdate: false });
    if (from != null) {
      window.__editor.commands.setTextSelection({ from, to: to ?? from });
      window.__editor.commands.scrollIntoView();
    }
  },
  getSelection: () => {
    const s = window.__editor.state.selection;
    return { from: s.from, to: s.to };
  },
  applyCommand: (cmd, arg) => {
    const chain = window.__editor.chain().focus();
    switch (cmd) {
      case 'bold': chain.toggleBold(); break;
      case 'italic': chain.toggleItalic(); break;
      case 'strike': chain.toggleStrike(); break;
      case 'code': chain.toggleCode(); break;
      case 'h1': chain.toggleHeading({ level: 1 }); break;
      case 'blockquote': chain.toggleBlockquote(); break;
      case 'bulletList': chain.toggleBulletList(); break;
      case 'orderedList': chain.toggleOrderedList(); break;
      case 'taskList': chain.toggleTaskList(); break;
      case 'link': {
        const url = arg || 'https://';
        if (window.__editor.isActive('link')) chain.unsetLink();
        else chain.setLink({ href: url });
        break;
      }
      case 'timestamp': chain.insertContent(ts()); break;
      default: return false;
    }
    chain.run();
    return true;
  },
  focus: () => window.__editor.commands.focus('end'),
  clear: () => window.__editor.commands.clearContent({ emitUpdate: false }),
  getActive: () => ({
    bold: window.__editor.isActive('bold'),
    italic: window.__editor.isActive('italic'),
    strike: window.__editor.isActive('strike'),
    code: window.__editor.isActive('code'),
    h1: window.__editor.isActive('heading', { level: 1 }),
    blockquote: window.__editor.isActive('blockquote'),
    bulletList: window.__editor.isActive('bulletList'),
    orderedList: window.__editor.isActive('orderedList'),
    taskList: window.__editor.isActive('taskList'),
    link: window.__editor.isActive('link'),
  }),
};

function ts() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

window.__ready = true;
</script>
</body>
</html>
