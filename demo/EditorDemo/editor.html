<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #101115;
    color: #ebebee;
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ---- 工具栏（对应主应用：透明底 + hover 淡入，无 chrome） ---- */
  #toolbar {
    display: flex;
    gap: 2px;
    padding: 8px 10px 6px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    user-select: none;
    flex-wrap: wrap;
  }
  #toolbar button {
    min-width: 26px;
    height: 24px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: rgba(255,255,255,0.66);
    font-size: 13px;
    font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    cursor: pointer;
    padding: 0 5px;
    transition: background 100ms ease, color 100ms ease;
  }
  #toolbar button:hover { background: rgba(255,255,255,0.065); color: rgba(255,255,255,0.84); }
  #toolbar button:active { background: rgba(255,255,255,0.10); }
  #toolbar button.active { color: #6ea8ff; background: rgba(110,168,255,0.12); }
  #toolbar .sep { width: 1px; background: rgba(255,255,255,0.07); margin: 4px 5px; }

  /* ---- 编辑器 ---- */
  .ProseMirror {
    outline: none;
    padding: 14px 14px 40px;
    min-height: 300px;
    user-select: text;
    caret-color: #ebebee;
  }
  .ProseMirror h1 { font-size: 19px; font-weight: 600; color: #c8cbd4; margin: 0.5em 0; }
  .ProseMirror h2 { font-size: 17px; font-weight: 600; color: #c8cbd4; margin: 0.5em 0; }
  .ProseMirror h3 { font-size: 16px; font-weight: 600; color: #c8cbd4; margin: 0.5em 0; }
  .ProseMirror p { margin: 0.35em 0; }
  .ProseMirror strong { font-weight: 700; }
  .ProseMirror em { font-style: italic; }
  .ProseMirror s { text-decoration: line-through; color: rgba(235,235,238,0.62); }
  .ProseMirror code {
    font-family: Consolas, monospace;
    font-size: 13px;
    background: rgba(110,168,255,0.16);
    color: #6ea8ff;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .ProseMirror a { color: #6ea8ff; text-decoration: underline; cursor: pointer; }
  .ProseMirror blockquote {
    margin: 0.5em 0;
    padding-left: 12px;
    border-left: 3px solid rgba(255,255,255,0.18);
    color: rgba(235,235,238,0.58);
  }
  .ProseMirror ul, .ProseMirror ol { margin: 0.3em 0; padding-left: 22px; }
  .ProseMirror li { margin: 0.15em 0; }

  /* 任务列表：真实勾选框 */
  .ProseMirror ul[data-type="taskList"] { list-style: none; padding-left: 4px; }
  .ProseMirror ul[data-type="taskList"] li {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0.2em 0;
  }
  .ProseMirror ul[data-type="taskList"] li > label {
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"] {
    appearance: none;
    width: 15px;
    height: 15px;
    border: 1.5px solid rgba(255,255,255,0.45);
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"]:hover { border-color: rgba(255,255,255,0.7); }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"]:checked {
    background: #6ea8ff;
    border-color: #6ea8ff;
  }
  .ProseMirror ul[data-type="taskList"] li > label input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4px; top: 1px;
    width: 4px; height: 8px;
    border: solid #0a0b0f;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .ProseMirror ul[data-type="taskList"] li[data-checked="true"] > div { color: rgba(235,235,238,0.42); text-decoration: line-through; }
  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: rgba(255,255,255,0.24);
    float: left;
    height: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="toolbar">
  <button data-cmd="bold" title="粗体"><b>B</b></button>
  <button data-cmd="italic" title="斜体"><i>I</i></button>
  <button data-cmd="strike" title="删除线"><s>S</s></button>
  <button data-cmd="code" title="行内代码">`</button>
  <button data-cmd="link" title="链接">🔗</button>
  <span class="sep"></span>
  <button data-cmd="h1" title="标题">H</button>
  <button data-cmd="blockquote" title="引用">❝</button>
  <span class="sep"></span>
  <button data-cmd="bulletList" title="无序列表">•</button>
  <button data-cmd="orderedList" title="有序列表">1.</button>
  <button data-cmd="taskList" title="任务列表">☑</button>
  <span class="sep"></span>
  <button data-cmd="timestamp" title="插入时间戳">🕐</button>
</div>
<div id="editor"></div>

<script type="importmap">
{
  "imports": {
    "@tiptap/core": "https://esm.sh/@tiptap/core@2.6.6",
    "@tiptap/pm/state": "https://esm.sh/@tiptap/pm@2.6.6/state",
    "@tiptap/pm/view": "https://esm.sh/@tiptap/pm@2.6.6/view",
    "@tiptap/pm/model": "https://esm.sh/@tiptap/pm@2.6.6/model",
    "@tiptap/pm/keymap": "https://esm.sh/@tiptap/pm@2.6.6/keymap",
    "@tiptap/pm/commands": "https://esm.sh/@tiptap/pm@2.6.6/commands",
    "@tiptap/pm/schema-list": "https://esm.sh/@tiptap/pm@2.6.6/schema-list",
    "@tiptap/pm/transform": "https://esm.sh/@tiptap/pm@2.6.6/transform",
    "@tiptap/pm/inputrules": "https://esm.sh/@tiptap/pm@2.6.6/inputrules",
    "@tiptap/pm/trailing-node": "https://esm.sh/@tiptap/pm@2.6.6/trailing-node",
    "@tiptap/pm/gapcursor": "https://esm.sh/@tiptap/pm@2.6.6/gapcursor",
    "@tiptap/pm/dropcursor": "https://esm.sh/@tiptap/pm@2.6.6/dropcursor",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@2.6.6",
    "@tiptap/extension-task-list": "https://esm.sh/@tiptap/extension-task-list@2.6.6",
    "@tiptap/extension-task-item": "https://esm.sh/@tiptap/extension-task-item@2.6.6",
    "@tiptap/extension-link": "https://esm.sh/@tiptap/extension-link@2.6.6",
    "@tiptap/extension-placeholder": "https://esm.sh/@tiptap/extension-placeholder@2.6.6"
  }
}
</script>
<script type="module">
import { Editor } from '@tiptap/core';
import StarterKit from '@tiptap/starter-kit';
import TaskList from '@tiptap/extension-task-list';
import TaskItem from '@tiptap/extension-task-item';
import Link from '@tiptap/extension-link';
import Placeholder from '@tiptap/extension-placeholder';

const editor = new Editor({
  element: document.getElementById('editor'),
  extensions: [
    StarterKit,
    TaskList,
    TaskItem.configure({ nested: true }),
    Link.configure({ openOnClick: false }),
    Placeholder.configure({ placeholder: 'Start typing…' }),
  ],
  content: `
    <h1>NotchNotes 编辑器 Demo</h1>
    <p>这是 <strong>粗体</strong>、<em>斜体</em>、<s>删除线</s>、<code>行内代码</code> 和 <a href="https://example.com">链接</a></p>
    <blockquote>引用：这是 Markdown 的引用块效果</blockquote>
    <p>任务列表（点击勾选框切换）：</p>
    <ul data-type="taskList">
      <li data-type="taskItem" data-checked="false">写周报</li>
      <li data-type="taskItem" data-checked="true">交房租</li>
    </ul>
    <ul><li>无序列表项一</li><li>无序列表项二</li></ul>
    <ol><li>有序列表项一</li><li>有序列表项二</li></ol>
  `,
  editorProps: {
    attributes: { spellcheck: 'false' },
  },
  onUpdate: () => refreshToolbar(),
  onSelectionUpdate: () => refreshToolbar(),
});

function ts() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function refreshToolbar() {
  const map = {
    bold: editor.isActive('bold'), italic: editor.isActive('italic'),
    strike: editor.isActive('strike'), code: editor.isActive('code'),
    h1: editor.isActive('heading', { level: 1 }), blockquote: editor.isActive('blockquote'),
    bulletList: editor.isActive('bulletList'), orderedList: editor.isActive('orderedList'),
    taskList: editor.isActive('taskList'),
  };
  document.querySelectorAll('#toolbar button[data-cmd]').forEach(b => {
    b.classList.toggle('active', !!map[b.dataset.cmd]);
  });
}

document.querySelectorAll('#toolbar button[data-cmd]').forEach(btn => {
  btn.addEventListener('click', () => {
    const cmd = btn.dataset.cmd;
    const chain = editor.chain().focus();
    switch (cmd) {
      case 'bold': chain.toggleBold(); break;
      case 'italic': chain.toggleItalic(); break;
      case 'strike': chain.toggleStrike(); break;
      case 'code': chain.toggleCode(); break;
      case 'h1': chain.toggleHeading({ level: 1 }); break;
      case 'blockquote': chain.toggleBlockquote(); break;
      case 'bulletList': chain.toggleBulletList(); break;
      case 'orderedList': chain.toggleOrderedList(); break;
      case 'taskList': chain.toggleTaskList(); break;
      case 'link': {
        const prev = editor.getAttributes('link').href;
        const url = prev || prompt('链接地址:', 'https://');
        if (url) chain.setLink({ href: url }); else chain.unsetLink();
        break;
      }
      case 'timestamp': chain.insertContent(ts()); break;
    }
    chain.run();
    refreshToolbar();
  });
});

refreshToolbar();
</script>
</body>
</html>
